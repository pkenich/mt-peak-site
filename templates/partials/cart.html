<div class="cart-overlay" id="cartOverlay" aria-hidden="true"></div>
<aside class="cart-panel" id="cartPanel" role="dialog" aria-modal="true" aria-labelledby="cartTitle" inert>
  <div class="cart-top">
    <h2 id="cartTitle">Your Reserve</h2>
    <button class="cart-close" aria-label="Close cart">✕</button>
  </div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-foot">
    <div class="cart-total" aria-live="polite"><span>Total</span><span>£<span id="cartTotal">0</span></span></div>
    <button class="cart-checkout" id="cartCheckout">Proceed to Checkout</button>
    <p class="cart-note">{{site.cartNote}}</p>
  </div>
</aside>
